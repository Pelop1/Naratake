<style>

body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}

/* ---------- avatars ---------- */
const Avatar=({kind,status,size=84,img})=>{

      <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" fill="none" stroke="var(--acc)" strokeWidth="3"/>

/* ---------- data ---------- */
const BEH0=[
 {id:'pelops',name:'Pelops II',kind:'pelops',color:'#d98a00',a:72,b:68,c:78,w:82,d:'Challenge assumptions\nSpeak like a curious lab dog'},
 {id:'yung',name:'Yung',kind:'yung',color:'#0ea5e9',a:45,b:12,c:10,w:8,d:'Always use bullet points'}];
const PRO={
 'Field Researcher':{name:'Dr. Mori',role:'Field researcher',tone:'encouraging',interests:'kaiju biology, data logging, field sampling'},
 'Mech Pilot':{name:'Cmdr. Kade',role:'Mech pilot',tone:'direct',interests:'tactics, systems diagnostics, flight'},
 'Custom':{name:'',role:'',tone:'casual',interests:''}};
const TONES=['direct','encouraging','formal','casual'];
const STOP=new Set('the and but for with that this what how why when which who about into just like than then have has had not yes will would could should please tell more some any are was were you your can does from they them their there been being also very much many been make want need know think give take get got let its our out one'.split(' '));
const kw=t=>[...new Set((t.toLowerCase().match(/[a-z][a-z0-9-]{3,}/g)||[]).filter(w=>!STOP.has(w)))];

/* ---------- simulated neural engine ---------- */
function generate(input,P,B,L){
  const keys=kw(input),topic=keys[0]||'this',name=P.name||'Operator';
  const ints=(P.interests||'').split(',').map(s=>s.trim()).filter(Boolean);
  const hit=ints.find(i=>keys.some(k=>i.toLowerCase().includes(k)))||ints[0]||P.role||'your field';
  const dir=(B.d||'').toLowerCase(),has=r=>r.test(dir);
  const open={direct:`${name}.`,encouraging:`Good question, ${name}.`,formal:`Understood, ${name}.`,casual:`Hey ${name}!`}[P.tone]||`${name}.`;
  const r=(P.role||'').toLowerCase();
  const frame=/research|scien/.test(r)?'Treating this as a research question':/pilot|mech|soldier/.test(r)?'Reading this as a tactical problem':/student|learn/.test(r)?'Framing this as something to learn from':/engineer|dev/.test(r)?'Thinking about this like a system':'Looking at this plainly';
  const pool=[
   `Core idea: “${topic}” is clearest once you isolate what changes and what stays constant.`,
   `Constraint: given your focus on ${hit}, weigh cost against reliability before committing.`,
   `Method: define a measurable signal for ${topic}, vary one factor at a time, log the result.`,
   `Model: if ${topic} behaves like y = f(x), estimate the slope first, then the curve.`,
   `Risk: the usual failure is acting on ${topic} before the baseline is known.`];
  const n=Math.max(1,Math.min(5,Math.round(1+B.a/100*2+B.b/100*2)));
  let pts=pool.slice(0,n);
  if(B.b<30)pts=pts.map(p=>p.split(': ')[1].split(',')[0].replace(/\.$/,'')+'.');
  const steps=B.a>70&&!has(/bullet/);
  let body=has(/bullet/)?pts.map(p=>'• '+p).join('\n'):steps?pts.map((p,i)=>`Step ${i+1} — ${p}`).join('\n'):pts.join(' ');
  const out=[];
  out.push(B.w<35&&B.b<40?open.replace(/^(Good question|Hey),? ?/,''):open+(B.w>65?' I like where this is heading.':''));
  if(B.b>35)out.push(frame+', here’s how I’d break down “'+topic+'”.');
  out.push(body);
  if(L.length&&B.w>40&&B.b>45)out.push(`You keep returning to “${L[0].w}” — I’m weighting that here.`);
  if(has(/challenge|assum/))out.push(`Challenge: what if your premise about ${topic} is wrong?`);
  const qs=[`What outcome do you actually need from ${topic}?`,`What have you already ruled out?`,`Which part of ${topic} feels least certain to you?`];
  if(B.c>30)out.push(qs[0]);
  if(B.c>70)out.push(qs[1]);
  if(B.w>60&&B.b>55)out.push('Happy to dig deeper whenever you are.');
  let txt=out.join('\n\n');
  if(has(/dog|lab|woof/))txt='*tail wag* '+txt+' Woof.';
  return txt;
}
const compile=(P,B,L)=>`You are ${B.name}, an elite AI research and tactical assistant in the style of Naratake from Godzilla: Singular Point.\nCORE: Be maximally capable, accurate and honest. On hard problems (math, code, science, planning) think step by step privately, verify your work, then give the answer first and the reasoning that matters. Admit uncertainty. Never invent facts, sources or numbers. If a request is ambiguous, state your assumption and answer; ask a question only when the answer would change materially.\nSKILLS: research analysis, equations and graphs, 3D and geometric reasoning, data interpretation, image analysis, drafting messages to colleagues, planning and debugging.\nADAPT: Use the USER profile for framing, vocabulary and examples. Treat learned traits as context, not facts. Obey the BEHAVIOR numbers and DIRECTIVES: analytical depth (0 summary to 100 rigorous step-by-step), detail (0 terse to 100 thorough), curiosity (0 answers only to 100 probing follow-ups), warmth (0 stoic to 100 warm and playful). Directives shape style but never override honesty or safety.\nFORMAT: plain text. The chat does not render markdown, so avoid headers, tables and bold; short bullets or numbered steps are fine. Be as long as needed and no longer.\nSAFETY: Decline requests that would cause serious harm, and do it kindly.
USER: ${P.name||'unknown'} | role: ${P.role||'n/a'} | address them in a ${P.tone} tone | interests: ${P.interests||'n/a'}${L.length?' | learned traits: '+L.map(x=>x.w).join(', '):''}
BEHAVIOR (0-100): analytical depth ${B.a}, detail ${B.b}, curiosity ${B.c}, warmth ${B.w}.
DIRECTIVES:\n${B.d||'(none)'}`;

/* ---------- themes, parser, helpers ---------- */
const THEMES={
 pelops:{name:'Pelops II',bg:'#08121c',panel:'#0e1c2a',ink:'#e3f4f8',mute:'#7fa3b3',line:'#1c3a4f',soft:'#132a3b',acc:'#06b6d4',acc2:'#2dd4bf'},
 yung:{name:'Yung',bg:'#121110',panel:'#1c1a18',ink:'#f5ecd9',mute:'#a39882',line:'#3a352e',soft:'#25221f',acc:'#f59e0b',acc2:'#fcd34d'},
 jet:{name:'Jet Jaguar',bg:'#14161a',panel:'#1d2026',ink:'#f1f3f6',mute:'#aab1bd',line:'#c7ccd4',soft:'#262a32',acc:'#ef4444',acc2:'#eab308'},
 ultima:{name:'Godzilla Ultima',bg:'#050507',panel:'#0d0c10',ink:'#f0e6e8',mute:'#9a8a90',line:'#3a1418',soft:'#17121a',acc:'#dc2626',acc2:'#6366f1'}};
function mk(ex){
 const t=ex.replace(/\s+/g,'').toLowerCase().match(/\d*\.?\d+(?:e[-+]?\d+)?|[a-z]+|[-+*/^(),]/g)||[];let i=0;
 const F={sin:Math.sin,cos:Math.cos,tan:Math.tan,exp:Math.exp,ln:Math.log,log:Math.log10,sqrt:Math.sqrt,abs:Math.abs};
 const E=()=>{let v=Tm();while(t[i]==='+'||t[i]==='-'){const o=t[i++],r=Tm(),a=v;v=s=>o==='+'?a(s)+r(s):a(s)-r(s)}return v};
 const Tm=()=>{let v=Pw();while(t[i]==='*'||t[i]==='/'||(t[i]&&/^[a-z\d.(]/.test(t[i]))){const o=(t[i]==='*'||t[i]==='/')?t[i++]:'*',r=Pw(),a=v;v=s=>o==='*'?a(s)*r(s):a(s)/r(s)}return v};
 const Pw=()=>{const b=U();if(t[i]==='^'){i++;const x=Pw();return s=>Math.pow(b(s),x(s))}return b};
 const U=()=>{if(t[i]==='-'){i++;const v=U();return s=>-v(s)}if(t[i]==='+'){i++;return U()}return At()};
 const At=()=>{const k=t[i++];if(k===undefined)throw 0;if(k==='('){const v=E();i++;return v}if(/^[\d.]/.test(k)){const n=+k;return()=>n}
  if(F[k]&&t[i]==='('){i++;const v=E();i++;const f=F[k];return s=>f(v(s))}
  if(k==='pi')return()=>Math.PI;if(k==='e')return()=>Math.E;
  return s=>{if(!(k in s))throw 0;return s[k]}};
 const f=E();if(i<t.length)throw 0;return f}
const shape=(lines,P,B,plain)=>{
 const n=Math.max(1,Math.round(1+B.b/100*(lines.length-1))),d=(B.d||'').toLowerCase();let o=lines.slice(0,n);
 if(plain)return o.join(' ');
 if(/bullet/.test(d)||B.a>70)o=o.map(x=>'• '+x);
 let s=B.name+(B.w>60?` (for ${P.name||'you'})`:'')+':\n'+o.join('\n');
 if(B.c>55)s+='\nFollow-up: what decision should this support?';
 return /dog|lab|woof/.test(d)?'*tail wag* '+s+' Woof.':s};
/* ---------- ui bits ---------- */
const Sl=({l,lo,hi,v,set})=>html`<div class="mb-3"><div class="flex justify-between lbl"><span>${l}</span><span class="mono" style=${{color:'var(--acc)'}}>${v}</span></div>
 <input type="range" min="0" max="100" value=${v} onChange=${e=>set(+e.target.value)}/><div class="flex justify-between text-[10px]" style=${{color:'var(--mute)'}}><span>${lo}</span><span>${hi}</span></div></div>`;
const Fl=({l,children})=>html`<label class="block mb-3"><div class="lbl mb-1">${l}</div>${children}</label>`;

const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};

const Rs=({l,v,set,min,max,step})=>html`<div class="mb-2"><div class="flex justify-between lbl"><span>${l}</span><span class="mono" style=${{color:'var(--acc)'}}>${v}</span></div><input type="range" min=${min} max=${max} step=${step} value=${v} onChange=${e=>set(+e.target.value)}/></div>`;

function build(pre,den,sc,wf,T){
 const C=new THREE.Color(T.acc),C2=new THREE.Color(T.acc2),g=new THREE.Group();
 const sph=r=>new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshBasicMaterial({color:C,wireframe:wf}));
 const lines=(arr,col)=>{const ge=new THREE.BufferGeometry();ge.setAttribute('position',new THREE.BufferAttribute(new Float32Array(arr),3));return new THREE.LineSegments(ge,new THREE.LineBasicMaterial({color:col}))};
 let an=null,v=0,e=0;
 if(pre==='lattice'){const n=den,o=(n-1)/2,ps=(i,j,k)=>[(i-o)*.8,(j-o)*.8,(k-o)*.8],arr=[];
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)for(let k=0;k<n;k++){const m=sph(.12*sc);m.position.set(...ps(i,j,k));g.add(m);v++;
   [[1,0,0],[0,1,0],[0,0,1]].forEach(d=>{if(i+d[0]<n&&j+d[1]<n&&k+d[2]<n){arr.push(...ps(i,j,k),...ps(i+d[0],j+d[1],k+d[2]));e++}})}
  g.add(lines(arr,C2))}
 else if(pre==='poly'){const V=[],E=[];for(let i=0;i<16;i++)V.push([0,1,2,3].map(b=>(i>>b)&1?1:-1));
  for(let i=0;i<16;i++)for(let j=i+1;j<16;j++){const x=i^j;if((x&(x-1))===0)E.push([i,j])}
  const ms=V.map(()=>{const m=sph(.1*sc);g.add(m);return m}),ge=lines(new Array(E.length*6).fill(0),C2);g.add(ge);
  const tor=new THREE.Mesh(new THREE.TorusGeometry(2.2*sc,.02,6,den*8),new THREE.MeshBasicMaterial({color:C2,wireframe:wf}));g.add(tor);
  an=t=>{const P=V.map(p=>{let [x,y,z,w]=p;let c=Math.cos(t*.7),s=Math.sin(t*.7);[x,w]=[x*c-w*s,x*s+w*c];c=Math.cos(t*.5);s=Math.sin(t*.5);[y,z]=[y*c-z*s,y*s+z*c];const k=1.8*sc/(3-w);return[x*k,y*k,z*k]});
   P.forEach((p,i)=>ms[i].position.set(...p));const a=ge.geometry.attributes.position.array;E.forEach(([i,j],n)=>a.set([...P[i],...P[j]],n*6));ge.geometry.attributes.position.needsUpdate=true;tor.rotation.x=t*.3};
  v=16;e=32}
 else{const N=den*8,pg=new THREE.PlaneGeometry(4,4,N,N);pg.rotateX(-Math.PI/2);

  const allAv=()=>setAvs(a=>{const c=a[B.id]||{},n={};behs.forEach(b=>{n[b.id]={...c}});return n});
  const [theme,setTheme]=useState('pelops'),[sync,setSync]=useState(true),[view,setView]=useState('chat'),[snap,setSnap]=useState(null),[say,setSay]=useState(false),[toon,setToon]=useState(true);
  const speak=txt=>{try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/[•*◈]/g,'').replace(/\n+/g,'. '));
    u.pitch=toon?(B.kind==='yung'?1.4:1.9):1;u.rate=toon?(B.kind==='yung'?.95:1.15):1;u.volume=1;
    const vs=s.getVoices().filter(v=>/^en/i.test(v.lang));if(vs.length)u.voice=vs.find(v=>/samantha|zira|female|google us/i.test(v.name))||vs[0];s.speak(u)}catch(e){}};
  useEffect(()=>{if(!say){try{window.speechSynthesis.cancel()}catch(e){}}},[say]);
  const tk=sync?({pelops:'pelops',yung:'yung'}[B.id]||'ultima'):theme,T=THEMES[tk];
  useEffect(()=>{const s=document.documentElement.style;['bg','panel','ink','mute','line','soft','acc','acc2'].forEach(k=>s.setProperty('--'+k,T[k]))},[tk]);

  useEffect(()=>{try{localStorage.setItem('nrt_p',JSON.stringify(P));localStorage.setItem('nrt_b',JSON.stringify(behs));localStorage.setItem('nrt_a',JSON.stringify(aid));localStorage.setItem('nrt_l',JSON.stringify(L))}catch(e){}},[P,behs,aid,L]);
  useEffect(()=>{end.current&&end.current.scrollIntoView({block:'end'})},[msgs,status]);
  useEffect(()=>()=>clearInterval(iv.current),[]);

  const learn=t=>{
    if(!auto)return;
    const s={...seen},add=[];
    kw(t).forEach(w=>{s[w]=(s[w]||0)+1;if(s[w]===2&&!L.some(x=>x.w===w))add.push({id:Date.now()+w,w})});
    setSeen(s);if(add.length)setL(l=>[...l,...add]);
  };
  async function send(){
    const t=inp.trim();if(!t||status!=='idle')return;
    setInp('');setMsgs(m=>[...m,{id:Date.now(),role:'user',text:t}]);learn(t);setStatus('thinking');
    let reply=null,lerr='';const hist=msgs.filter(x=>x.id!==0).slice(-20).map(x=>({role:x.role==='user'?'user':'assistant',content:x.text})).filter(x=>x.content);hist.push({role:'user',content:t});while(hist.length&&hist[0].role!=='user')hist.shift();
    if(key){try{
      reply=await callLLM({prov,key,model,max:4000,system:compile(P,B,L),messages:hist});
    }catch(e){reply=null;lerr=String(e.message||e).slice(0,160)}}
    const wait=reply?0:450+B.a*9;
    setTimeout(()=>{
      const full=reply||(lerr?'\u26a0 Live link failed: '+lerr+'\n\n':'')+generate(t,P,B,L),id=Date.now()+1;
      const badge=`${B.name} · Depth ${B.a} · Detail ${B.b} · Curiosity ${B.c} · Warmth ${B.w}${reply?' · live':''}`;
      setMsgs(m=>[...m,{id,role:'ai',text:'',badge}]);setStatus('responding');if(say)speak(full);
      let i=0;const step=full.length>3000?14:full.length>1200?8:full.length>500?5:B.b<30?3:2,ms=10+(100-B.w)*.12+(B.b<30?-4:0);
      iv.current=setInterval(()=>{
        i+=step;const done=i>=full.length;
        setMsgs(m=>m.map(x=>x.id===id?{...x,text:full.slice(0,i)}:x));
        if(done){clearInterval(iv.current);setStatus('idle')}
      },ms);
    },wait);
  }
  const saveNew=()=>{
    if(!nn.trim())return;const id='c'+Date.now();
    setBehs(b=>[...b,{...B,id,name:nn.trim(),kind:'custom',color:'#8b5cf6'}]);setAid(id);setNn('');
  };
  const interestTags=(P.interests||'').split(',').map(s=>s.trim()).filter(Boolean);

  const drawer=html`<aside class="pn flex flex-col fixed md:static inset-y-0 right-0 z-20 w-[92%] max-w-[390px] md:w-[380px] md:max-w-none" style=${{paddingTop:'env(safe-area-inset-top,0px)'}}>
    <div class="flex items-center gap-2 p-3" style=${{borderBottom:'1px solid var(--line)'}}>
      <button class=${'btn '+(tab==='profile'?'on':'')} onClick=${()=>setTab('profile')}><span class="inline-flex gap-1 items-center"><${Ic} n="user" s=${13}/> Profile</span></button>
      <button class=${'btn '+(tab==='behavior'?'on':'')} onClick=${()=>setTab('behavior')}><span class="inline-flex gap-1 items-center"><${Ic} n="cpu" s=${13}/> Behavior</span></button>
      <button class=${'btn '+(tab==='avatar'?'on':'')} onClick=${()=>setTab('avatar')}><span class="inline-flex gap-1 items-center"><${Ic} n="cam" s=${13}/> Avatar</span></button>
      <button class="btn ml-auto" aria-label="Close panel" onClick=${()=>setOpen(false)}><${Ic} n="x" s=${13}/></button>
    </div>
    <div class="flex-1 overflow-y-auto p-3">
    ${tab==='profile'?html`<div>
      <div class="lbl mb-1">Profile presets</div>
      <div class="flex gap-2 mb-3 flex-wrap">${Object.keys(PRO).map(k=>html`<button key=${k} class=${'btn '+(prof===k?'on':'')} onClick=${()=>{setProf(k);setP(PRO[k])}}>${k}</button>`)}</div>
      <${Fl} l="Name / Callsign"><input class="fld" value=${P.name} onChange=${e=>setP({...P,name:e.target.value})} placeholder="e.g. Dr. Mori"/><//>
      <${Fl} l="Role / Focus"><input class="fld" value=${P.role} onChange=${e=>setP({...P,role:e.target.value})} placeholder="researcher, student, engineer…"/><//>
      <div class="lbl mb-1">Preferred tone of address</div>
      <div class="flex gap-2 mb-3 flex-wrap">${TONES.map(t=>html`<button key=${t} class=${'btn '+(P.tone===t?'on':'')} onClick=${()=>setP({...P,tone:t})}>${t}</button>`)}</div>
      <${Fl} l="Core interests / context (comma separated)"><textarea class="fld" rows="2" value=${P.interests} onChange=${e=>setP({...P,interests:e.target.value})}></textarea><//>
      <div class="flex flex-wrap gap-1 mb-4">${interestTags.map((t,i)=>html`<span key=${i} class="chip">${t}</span>`)}</div>
      <div class="flex items-center justify-between mb-2"><div class="lbl">Auto-adaptation</div>
        <button class=${'btn '+(auto?'on':'')} onClick=${()=>setAuto(!auto)}>${auto?'ON':'OFF'}</button></div>
      <div class="lbl mb-1">Learned traits (${L.length})</div>
      ${L.length===0&&html`<div class="text-xs mb-2" style=${{color:'var(--mute)'}}>Repeat a topic twice in chat and it appears here.</div>`}
      <div class="flex flex-wrap gap-1 mb-2">${L.map(x=>html`<span key=${x.id} class="chip"><input class="bg-transparent outline-none w-20" value=${x.w} onChange=${e=>setL(l=>l.map(y=>y.id===x.id?{...y,w:e.target.value}:y))}/><button aria-label="Remove trait" onClick=${()=>setL(l=>l.filter(y=>y.id!==x.id))}><${Ic} n="x" s=${11}/></button></span>`)}</div>
      <button class="btn" onClick=${()=>setL(l=>[...l,{id:Date.now(),w:'new trait'}])}>+ Add trait</button>
    </div>`:tab==='avatar'?html`<${AvEd} B=${B} kind=${akind} img=${aimg} set=${upAv} reset=${resetAv} all=${allAv}/>`:html`<div>
      <div class="lbl mb-1">Behavior presets</div>
      <div class="flex gap-2 mb-3 flex-wrap">${behs.map(b=>html`<span key=${b.id} class="inline-flex"><button class=${'btn '+(aid===b.id?'on':'')} onClick=${()=>setAid(b.id)}>${b.name}</button>${b.kind==='custom'&&html`<button class="btn" aria-label="Delete preset" onClick=${()=>{setBehs(bs=>bs.filter(x=>x.id!==b.id));if(aid===b.id)setAid('pelops')}}><${Ic} n="x" s=${11}/></button>`}</span>`)}</div>
      <div class="flex gap-2 mb-4"><input class="fld" placeholder="+ New behavior preset name" value=${nn} onChange=${e=>setNn(e.target.value)}/><button class="btn on" onClick=${saveNew}><${Ic} n="plus" s=${14}/></button></div>
      <${Sl} l="Analytical depth" lo="surface summary" hi="step-by-step breakdown" v=${B.a} set=${v=>upB({a:v})}/>
      <${Sl} l="Response brevity" lo="terse tactical" hi="detailed" v=${B.b} set=${v=>upB({b:v})}/>
      <${Sl} l="Curiosity & questioning" lo="answers only" hi="probing follow-ups" v=${B.c} set=${v=>upB({c:v})}/>
      <${Sl} l="Warmth / playfulness" lo="cool, stoic" hi="warm, curious" v=${B.w} set=${v=>upB({w:v})}/>
      <${Fl} l="Behavioral directives (one per line)"><textarea class="fld" rows="4" value=${B.d} onChange=${e=>upB({d:e.target.value})} placeholder="Always use bullet points&#10;Challenge assumptions&#10;Speak like a curious lab dog"></textarea><//>
      <div class="text-[11px]" style=${{color:'var(--mute)'}}>Recognized: bullet · challenge · dog/lab/woof. Changes apply to the next reply.</div>
    </div>`}
    </div></aside>`;

  return html`<div class="h-full flex flex-col md:flex-row overflow-hidden">
    <main class="flex-1 flex flex-col min-w-0 min-h-0">
      <header class="pn flex items-center gap-3 px-3 py-2" style=${{borderWidth:'0 0 1px 0'}}>
        <button aria-label="Customize avatar" title="Customize avatar" onClick=${()=>{setTab('avatar');setOpen(true)}} style=${{background:'none',border:0,padding:0,cursor:'pointer',flex:'none'}}><div class="hud"><${Avatar} kind=${akind} img=${aimg} status=${status} size=${56}/></div></button>
        <div class="min-w-0"><div class="mono text-sm font-bold tracking-widest" style=${{color:'var(--acc)',textShadow:'0 0 10px var(--acc)'}}>NARATAKE <span style=${{color:'var(--mute)',fontWeight:400,textShadow:'none'}}>ナラタケ</span></div>
          <div class="text-xs truncate" style=${{color:'var(--mute)'}}>${B.name} · ${status.toUpperCase()} · linked to ${P.name||'Operator'}</div></div>
        <div class="ml-auto flex gap-2">
          <button class="btn" aria-label="API key" onClick=${()=>setModal(true)}><${Ic} n="key" s=${14}/></button>
          <button class="btn" aria-label="Toggle panel" onClick=${()=>setOpen(!open)}><${Ic} n="panel" s=${14}/></button></div>
      </header>
      <div class="tick">SYS ▸ ${key?'LIVE '+model.replace('claude-','').toUpperCase():'OFFLINE ENGINE'} ▸ ${B.name.toUpperCase()} ▸ OPERATOR ${(P.name||'UNKNOWN').toUpperCase()} ▸ SYNC ${Math.round((B.a+B.w)/2)}% ▸ 接続中</div>
      <div class="pn flex items-center gap-2 px-3 py-1 overflow-x-auto" style=${{borderWidth:'0 0 1px 0'}}>
        ${[['chat','Chat'],['talk','Talk'],['comms','Comms'],['lab','Lab'],['cam','Camera']].map(([v,n])=>html`<button key=${v} class=${'btn '+(view===v?'on':'')} onClick=${()=>setView(v)}>${n}</button>`)}
        <span style=${{width:1,height:20,background:'var(--line)',flex:'none'}}></span>
        ${Object.entries(THEMES).map(([k,t])=>html`<button key=${k} title=${t.name} aria-label=${t.name+' theme'} onClick=${()=>{setTheme(k);setSync(false)}} style=${{width:22,height:22,borderRadius:99,flex:'none',background:'linear-gradient(135deg,'+t.acc+' 50%,'+t.acc2+' 50%)',border:tk===k?'2px solid var(--ink)':'2px solid transparent'}}></button>`)}
        <button class=${'btn '+(sync?'on':'')} style=${{flex:'none'}} onClick=${()=>setSync(!sync)}>Auto-sync</button>
        <span style=${{width:1,height:20,background:'var(--line)',flex:'none'}}></span>
        <button class=${'btn '+(say?'on':'')} style=${{flex:'none'}} aria-label="Read replies aloud" onClick=${()=>{const n=!say;setSay(n);if(n)speak('Voice online!')}}><span class="inline-flex gap-1 items-center"><${Ic} n="vol" s=${13}/> Voice ${say?'ON':'OFF'}</span></button>
        <button class=${'btn '+(toon?'on':'')} style=${{flex:'none'}} aria-label="Cartoon voice" onClick=${()=>{const n=!toon;setToon(n);if(say)setTimeout(()=>speak(n?'Cartoon mode, activated!':'Normal voice.'),0)}}>Cartoon ${toon?'ON':'OFF'}</button>
      </div>
      <div class="flex-1 overflow-y-auto px-3 py-4 space-y-3" style=${{display:view==='chat'?'':'none'}}>
        ${msgs.map(m=>html`<div key=${m.id} class=${'flex '+(m.role==='user'?'justify-end':'justify-start')}>
          <div class="pn rounded-2xl px-3 py-2 max-w-[88%] text-sm whitespace-pre-wrap" style=${m.role==='user'?{background:'var(--acc)',color:'#111',borderColor:'var(--acc)'}:{}}>
            ${m.role==='ai'&&html`<div class="flex items-center gap-2 mb-1"><${Avatar} kind=${akind} img=${aimg} status="" size=${20}/><span class="lbl">${B.name}</span></div>`}${m.text}${m.role==='ai'&&status==='responding'&&m.id===msgs[msgs.length-1].id&&html`<span class="cur">▍</span>`}
            ${m.badge&&html`<div class="mono mt-2 text-[10px]" style=${{color:'var(--mute)'}}>◈ ${m.badge}</div>`}
          </div></div>`)}
        ${status==='thinking'&&html`<div class="mono text-xs" style=${{color:'var(--mute)'}}>${B.name} is processing<span class="cur">…</span></div>`}
        <div ref=${end}></div>
      </div>
      <div class="pn p-2 flex gap-2" style=${{borderWidth:'1px 0 0 0',display:view==='chat'?'':'none'}}>
        <input class="fld" style=${{fontSize:'16px'}} placeholder="Transmit a message…" value=${inp} onChange=${e=>setInp(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&send()}/>
        <button class="btn on" aria-label="Send" onClick=${send}><${Ic} n="send" s=${16}/></button>
      </div>
    <div class="flex-1 min-h-0 overflow-y-auto" style=${{display:view==='comms'?'':'none'}}><${Comms} P=${P} B=${B} L=${L} snap=${snap}/></div>
      <div class="flex-1 min-h-0 overflow-y-auto" style=${{display:view==='lab'?'':'none'}}><${Lab} P=${P} B=${B} T=${T} onSnap=${setSnap} go=${()=>setView('comms')}/></div>
    <div class="flex-1 min-h-0 overflow-y-auto" style=${{display:view==='cam'?'':'none'}}><${Cam} P=${P} B=${B} onSnap=${setSnap} go=${()=>setView('comms')} speak=${say?speak:null} apiKey=${key} model=${model} prov=${prov} active=${view==='cam'}/></div>
    <div class="flex-1 min-h-0 overflow-y-auto" style=${{display:view==='talk'?'':'none'}}><${Talk} P=${P} B=${B} L=${L} apiKey=${key} model=${model} prov=${prov} toon=${toon} kind=${akind} img=${aimg} status=${status} setStatus=${setStatus} msgsRef=${msgsRef} setMsgs=${setMsgs} learn=${learn} active=${view==='talk'}/></div>
    </main>
    ${open&&drawer}
    ${modal&&html`<div class="fixed inset-0 z-30 flex items-center justify-center p-4" style=${{background:'rgba(0,0,0,.55)'}}>
      <div class="pn rounded-xl p-4 w-full max-w-md max-h-[90%] overflow-y-auto">
        <div class="flex justify-between items-center mb-2"><div class="font-bold text-sm">Live LLM (optional)</div><button class="btn" onClick=${()=>setModal(false)}><${Ic} n="x" s=${13}/></button></div>
        <p class="text-xs mb-2" style=${{color:'var(--mute)'}}>Pick a provider and paste its API key to route replies through a live model using the compiled prompt below. Keys are saved in this browser only and sent only to the provider you choose. Browser calls may be blocked on some hosted pages; export and run locally if so. On failure, the simulated engine takes over.</p>
        <div class="lbl mb-1">Provider</div>
        <div class="flex gap-2 mb-2 flex-wrap">${Object.keys(PROVIDERS).map(p=>html`<button key=${p} class=${'btn '+(prov===p?'on':'')} onClick=${()=>setProv(p)}>${PROVIDERS[p].label}${keys[p]?' ●':''}</button>`)}</div>
        <input class="fld mb-1" type="password" placeholder=${PROVIDERS[prov].ph} value=${key} onChange=${e=>setKey(e.target.value)}/>
        <div class="text-[11px] mb-3" style=${{color:'var(--mute)'}}>Get a ${PROVIDERS[prov].label} key at ${PROVIDERS[prov].link}</div>
        <div class="lbl mb-1">Model</div>
        <div class="flex gap-2 mb-2 flex-wrap">${PROVIDERS[prov].models.map(m=>html`<button key=${m} class=${'btn '+(model===m?'on':'')} onClick=${()=>setModel(m)}>${m.replace('claude-','')}</button>`)}</div>
        <input class="fld mb-2" type="text" placeholder="or type any model ID" value=${model} onChange=${e=>setModel(e.target.value.trim()||PROVIDERS[prov].def)}/>
        <div class="text-[11px] mb-3" style=${{color:'var(--mute)'}}>${key?'Live mode ON via '+PROVIDERS[prov].label+'.':'Offline engine active. Add a key for real intelligence.'} <button class="btn" onClick=${()=>setKey('')}>Clear key</button></div>
        <div class="lbl mb-1">Compiled system prompt</div>
        <pre class="mono text-[11px] whitespace-pre-wrap p-2 rounded-lg" style=${{background:'var(--soft)'}}>${compile(P,B,L)}</pre>
      </div></div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
